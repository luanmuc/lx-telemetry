name: ingest-digest

# 唯一入口：App 用 fine-grained PAT（仅 Issues: RW）在 luanmuc/lx-telemetry 开 issue。
# 本仓公开，读无需凭据；写只走 issue，仓库内容由本 workflow 自己提交。
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

# v1.0.1：并发按“仓”串行。原来的 per-issue 分组会让两台设备/两次提交同时 push → 后到者 fetch first 失败、Issue 永久留开。
concurrency:
  group: ingest-digest
  cancel-in-progress: false

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[digest]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 + 去重 + 落库
        id: ingest
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/ingest-digest.js

      - name: 提交 digests（有变化才提交）
        id: commit
        run: |
          git config user.name "lx-telemetry-bot"
          git config user.email "lx-telemetry-bot@users.noreply.github.com"
          git add digests
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "digest: #${{ github.event.issue.number }} ${{ steps.ingest.outputs.file }}"
          # 串行后仍可能叠上人工提交；push 失败用 rebase 重试 3 次，避免一次竞态就把 Issue 留开。
          # LT-01：重试耗尽必须判红。原写法 `git push && break` 在三次全失败后仍向下执行，
          # 然后照样写 changed=true；而回执步骤只看 steps.ingest.outputs.result，于是
          # 「数据随 runner 销毁 + Issue 被关掉」= 唯一证据自毁。这里用 pushed 标志兜住。
          pushed=false
          for i in 1 2 3; do
            if git push; then pushed=true; break; fi
            echo "push rejected, rebase retry $i"
            git pull --rebase origin main
            sleep $((i * 3))
          done
          if [ "$pushed" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::error::push 重试 3 次仍失败，本次数据未落库（runner 销毁后不可恢复）"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: 回执（成功/重复关闭，非法留开并说明）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.ingest.outputs.result }}
          FILE: ${{ steps.ingest.outputs.file }}
          REASON: ${{ steps.ingest.outputs.reason }}
        run: |
          if [ "$RESULT" = "ingested" ]; then
            gh issue comment "$NUM" --body "✅ 已入库：\`$FILE\`"
            gh issue close "$NUM"
          elif [ "$RESULT" = "duplicate" ]; then
            gh issue comment "$NUM" --body "ℹ️ 重复投递（同设备同时间点已存在），未重复写入：\`$FILE\`"
            gh issue close "$NUM"
          else
            gh issue comment "$NUM" --body "❌ 校验未通过，未入库：$REASON"
          fi

      - name: 落库失败回执（校验通过但没推上去，Issue 必须留开）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.ingest.outputs.result }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          # LT-01/LT-02：changed/pushed 原来是只写不读的死输出。这里让它们真正参与判定：
          # 校验通过（result=ingested）但 pushed=false 时，绝不能宣称"已入库"。
          if [ "$RESULT" = "ingested" ] && [ "$PUSHED" != "true" ]; then
            gh issue comment "$NUM" --body "❌ 校验通过但落库失败（push 重试 3 次仍被拒），数据未写入仓库。Issue 保持打开，请稍后重新投递同一份摘要。"
          fi
